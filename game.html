<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Play SnookerSnake — snooker-themed snake game for web and mobile.">
  <title>SnookerSnake — Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="game.css">
</head>
<body class="game-page">

  <header class="site-header site-header--scrolled" role="banner">
    <nav class="nav-container" aria-label="Game navigation">
      <a href="index.html" class="nav-logo" aria-label="Back to home">
        SnookerSnake
      </a>
    </nav>
  </header>

  <main class="game-main">
    <div class="game-wrapper">

      <div class="score-bar">
        <div class="score-item">
          <span class="score-label" id="hud-a-label">BREAK</span>
          <span class="score-value" id="hud-a-val">0</span>
        </div>
        <div class="score-item">
          <span class="score-label" id="hud-b-label">BEST</span>
          <span class="score-value" id="hud-b-val">0</span>
        </div>
        <div class="score-item" id="hud-c-item" hidden>
          <span class="score-label" id="hud-c-label">&times;1</span>
          <span class="score-value" id="hud-c-val">0</span>
        </div>
        <div class="score-item">
          <span class="score-label">ON</span>
          <span class="score-value score-value--on" id="on-val">RED</span>
        </div>
      </div>

      <div class="canvas-wrap">
        <canvas id="game-canvas" aria-label="Snake game board"></canvas>
      </div>
      <p class="share-line" id="share-line" hidden></p>

      <div class="game-controls">
        <button class="btn btn--primary" id="action-btn">START GAME</button>
      </div>

      <p class="kb-hint">// ARROWS OR WASD &mdash; SPACE TO START</p>

    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
