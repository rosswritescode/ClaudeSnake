<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Play MAX SNAKE — snooker-themed snake game for web and mobile.">
  <title>MAX SNAKE — Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="game.css">
</head>
<body class="game-page">

  <header class="site-header site-header--scrolled" role="banner">
    <nav class="nav-container" aria-label="Game navigation">
      <a href="index.html" class="nav-logo" aria-label="Back to home">
        <span class="logo-bracket">[</span>MAX SNAKE<span class="logo-bracket">]</span>
      </a>
      <div class="nav-game-score" aria-live="polite">
        BREAK: <span id="nav-score-val">0</span>
      </div>
    </nav>
  </header>

  <main class="game-main">
    <div class="game-wrapper">

      <div class="score-bar">
        <div class="score-item">
          <span class="score-label">BREAK</span>
          <span class="score-value" id="score-val">0</span>
        </div>
        <div class="score-item">
          <span class="score-label">BEST</span>
          <span class="score-value" id="hi-val">0</span>
        </div>
        <div class="score-item">
          <span class="score-label">ON</span>
          <span class="score-value score-value--on" id="on-val">RED</span>
        </div>
      </div>

      <div class="canvas-wrap">
        <canvas id="game-canvas" aria-label="Snake game board"></canvas>
      </div>
      <p class="share-line" id="share-line" hidden></p>

      <div class="settings-panel">
        <div class="setting-row">
          <span class="setting-label">BOARD</span>
          <div class="setting-options" role="group" aria-label="Board size">
            <button class="setting-btn setting-btn--active" data-setting="size" data-value="small">S</button>
            <button class="setting-btn" data-setting="size" data-value="medium">M</button>
            <button class="setting-btn" data-setting="size" data-value="large">L</button>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">SPEED</span>
          <div class="setting-options" role="group" aria-label="Game speed">
            <button class="setting-btn" data-setting="speed" data-value="slow">SLOW</button>
            <button class="setting-btn setting-btn--active" data-setting="speed" data-value="normal">NORM</button>
            <button class="setting-btn" data-setting="speed" data-value="fast">FAST</button>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">REDS</span>
          <div class="setting-options" role="group" aria-label="Number of reds">
            <button class="setting-btn" data-setting="reds" data-value="3">3</button>
            <button class="setting-btn setting-btn--active" data-setting="reds" data-value="5">5</button>
            <button class="setting-btn" data-setting="reds" data-value="8">8</button>
            <button class="setting-btn" data-setting="reds" data-value="10">10</button>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">WALLS</span>
          <div class="setting-options" role="group" aria-label="Wall behaviour">
            <button class="setting-btn" data-setting="walls" data-value="solid">SOLID</button>
            <button class="setting-btn setting-btn--active" data-setting="walls" data-value="wrap">WRAP</button>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">TIMER</span>
          <div class="setting-options" role="group" aria-label="Countdown timer">
            <button class="setting-btn setting-btn--active" data-setting="timer" data-value="0">OFF</button>
            <button class="setting-btn" data-setting="timer" data-value="20">20S</button>
            <button class="setting-btn" data-setting="timer" data-value="30">30S</button>
            <button class="setting-btn" data-setting="timer" data-value="50">50S</button>
            <button class="setting-btn" data-setting="timer" data-value="60">1M</button>
            <button class="setting-btn" data-setting="timer" data-value="120">2M</button>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">+2 WIN</span>
          <div class="setting-options" role="group" aria-label="+2 bonus window in seconds">
            <button class="setting-btn" data-setting="speedT1" data-value="1">1S</button>
            <button class="setting-btn setting-btn--active" data-setting="speedT1" data-value="2">2S</button>
            <button class="setting-btn" data-setting="speedT1" data-value="3">3S</button>
            <button class="setting-btn" data-setting="speedT1" data-value="4">4S</button>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">+1 WIN</span>
          <div class="setting-options" role="group" aria-label="+1 bonus window in seconds">
            <button class="setting-btn" data-setting="speedT2" data-value="1">1S</button>
            <button class="setting-btn setting-btn--active" data-setting="speedT2" data-value="2">2S</button>
            <button class="setting-btn" data-setting="speedT2" data-value="3">3S</button>
            <button class="setting-btn" data-setting="speedT2" data-value="4">4S</button>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">CARRY</span>
          <div class="setting-options" role="group" aria-label="Carry snake length between frames">
            <button class="setting-btn setting-btn--active" data-setting="carry" data-value="off">OFF</button>
            <button class="setting-btn" data-setting="carry" data-value="on">ON</button>
          </div>
        </div>
      </div>

      <div class="game-controls">
        <button class="btn btn--primary" id="action-btn">START GAME</button>
        <button class="btn btn--ghost" id="restart-btn" hidden>RESTART</button>
      </div>

      <div class="dpad" aria-label="Directional controls">
        <button class="dpad-btn dpad-up"    data-dir="up"    aria-label="Move up">&#9650;</button>
        <button class="dpad-btn dpad-left"  data-dir="left"  aria-label="Move left">&#9668;</button>
        <button class="dpad-btn dpad-right" data-dir="right" aria-label="Move right">&#9658;</button>
        <button class="dpad-btn dpad-down"  data-dir="down"  aria-label="Move down">&#9660;</button>
      </div>

      <p class="kb-hint">// ARROWS OR WASD &mdash; SPACE TO START</p>

    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
